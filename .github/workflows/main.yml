name: Build Muzammil Online Service v68 APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="
          find . -maxdepth 3 -type f \
            -not -path "./.git/*" | sort | head -200

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "package.json nahi mila."
          fi

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web App
        run: |
          mkdir -p www

          if [ -d "dist" ]; then
            cp -r dist/* www/
          elif [ -d "build" ]; then
            cp -r build/* www/
          elif [ -f "index.html" ]; then
            cp -r ./* www/ || true
          else
            echo "ERROR: Web app files nahi mile."
            exit 1
          fi

      - name: Initialize Capacitor
        run: |
          npx cap init \
            "Muzammil Online Service" \
            "com.muzammil.onlineservice" \
            --web-dir www

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK generate nahi hua."
            exit 1
          fi

          echo "APK:"
          echo "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v68-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
