name: Build Muzammil Online Service v55

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP
        run: |
          ZIP="Muzammil_Online_Service_PASSPORT_COMPACT_PREVIEW_v55.zip"
          test -f "$ZIP" || exit 1
          unzip -t "$ZIP"

      - name: Extract
        run: |
          rm -rf project
          mkdir project
          unzip -o "Muzammil_Online_Service_PASSPORT_COMPACT_PREVIEW_v55.zip" -d project

      - name: Find Project
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          test -n "$SETTINGS" || exit 1
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Check APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f | head -1)

          test -n "$APK" || exit 1
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v55-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
