name: Build Muzammil Online Service v68

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Inspect Repository
        run: |
          echo "=============================="
          echo "REPOSITORY CONTENT"
          echo "=============================="

          pwd
          echo ""

          find . -maxdepth 4 -type f \
            -not -path "./.git/*" \
            | sort

      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching Android Gradle project..."

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")

            echo "Found Gradle settings:"
            echo "$SETTINGS"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          GRADLE_BUILD=$(find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -1)

          if [ -n "$GRADLE_BUILD" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_BUILD")

            echo "Found Gradle build:"
            echo "$GRADLE_BUILD"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo ""
          echo "ERROR: Android Gradle project nahi mila."
          echo ""
          echo "Repository ke files upar print ho chuke hain."
          exit 1

      - name: Check App Module
        run: |
          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

          APP_DIR=$(find "$PROJECT_DIR" \
            -type f \
            \( -name "app/build.gradle" -o -name "app/build.gradle.kts" \) \
            | head -1)

          if [ -z "$APP_DIR" ]; then
            echo ""
            echo "ERROR: app/build.gradle ya app/build.gradle.kts nahi mila."
            exit 1
          fi

          echo ""
          echo "APP MODULE FOUND:"
          echo "$APP_DIR"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Using Gradle Wrapper..."
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Using installed Gradle..."
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK generate nahi hua."
            exit 1
          fi

          echo ""
          echo "=============================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=============================="

          echo "$APK"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v68-Photoshop-Transform-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
