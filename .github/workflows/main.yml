name: Build Muzammil Online Service APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project ZIP
        run: |
          ZIP="Muzammil_Online_Service_CV_NATIVE_PDF_JPG_FIXED_v13.zip"

          echo "======================================"
          echo "Muzammil Online Service APK Build"
          echo "======================================"

          echo "Checking project ZIP..."
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found!"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP found successfully."
          echo "Testing ZIP..."

          unzip -t "$ZIP"

          echo "ZIP test completed successfully."

      - name: Extract Android Project
        run: |
          rm -rf project
          mkdir -p project

          echo "Extracting Android project..."

          unzip -o \
            "Muzammil_Online_Service_CV_NATIVE_PDF_JPG_FIXED_v13.zip" \
            -d project

          echo "Project extracted."

          echo "Project files:"
          find project -maxdepth 6 -type f | head -200

      - name: Find Gradle Project
        run: |
          echo "Searching for Gradle project..."

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"

            echo "Available files:"
            find project -maxdepth 8 -type f

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Gradle Project
        run: |
          cd "$PROJECT_DIR"

          echo "Checking Gradle files..."

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle."
            gradle --version
          fi

      - name: Build Debug APK
        run: |
          echo "======================================"
          echo "Starting APK build..."
          echo "======================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning \
              --stacktrace

          else

            gradle assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning \
              --stacktrace

          fi

      - name: Find APK
        run: |
          echo "======================================"
          echo "Searching for generated APK..."
          echo "======================================"

          find project \
            -type f \
            -name "*.apk" \
            -print

      - name: Verify APK
        run: |
          APK=$(find project -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-APK-v13
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
