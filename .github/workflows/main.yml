name: Build Muzammil Online Service v68 APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'Muzammil_Online_Service_v68_*.zip' \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: v68 ZIP nahi mila."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Project
        run: |
          rm -rf project
          mkdir project
          unzip -q "$PROJECT_ZIP" -d project

          echo "Project files:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Locate Web Project
        shell: bash
        run: |
          set -e

          ROOT=$(find project -type f \
            \( -name package.json -o -name index.html \) \
            -print | sed 's#/[^/]*$##' | head -1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Web project nahi mila."
            exit 1
          fi

          echo "APP_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "App root: $ROOT"

      - name: Install Dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web App
        working-directory: ${{ env.APP_ROOT }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"
          then
            npm run build
          else
            echo "Build script nahi hai, existing web files use honge."
          fi

      - name: Prepare Web Files
        run: |
          rm -rf www
          mkdir www

          if [ -d "${APP_ROOT}/dist" ]; then
            cp -a "${APP_ROOT}/dist/." www/
          elif [ -d "${APP_ROOT}/build" ]; then
            cp -a "${APP_ROOT}/build/." www/
          else
            cp -a "${APP_ROOT}/." www/
          fi

          test -f www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          npx cap init \
            "Muzammil Online Service" \
            "com.muzammil.onlineservice" \
            --web-dir www

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        run: |
          APK=$(find android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK generate nahi hua."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v68-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
