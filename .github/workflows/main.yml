name: Build Muzammil Online Service APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project ZIP
        run: |
          Muzammil_Online_Service_CV_BIODATA_FINAL_FIXED_v10.zip"

          echo "Checking project ZIP..."
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found!"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP found successfully."

          echo "Testing ZIP..."
          unzip -t "$ZIP"

      - name: Extract Android Project
        run: |
          rm -rf project
          mkdir project

          echo "Extracting Android project..."

          unzip -o \
            "Muzammil_Online_Service_CV_BIODATA_DOWNLOAD_JPG_PREVIEW_FIXED.zip" \
            -d project

          echo "Project extracted."

          find project -maxdepth 6 -type f | head -200

      - name: Find Gradle Project
        run: |
          echo "Searching for Gradle project..."

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found!"

            echo "Available files:"
            find project -maxdepth 8 -type f

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          echo "Starting APK build..."

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning
          else
            gradle assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning
          fi

      - name: Find APK
        run: |
          echo "Searching for generated APK..."

          find project \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
