name: Build Muzammil Online Service APK v52

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK v52
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project ZIP
        run: |
          ZIP="Muzammil_Online_Service_PASSPORT_PHOTO_PRO_BACKGROUND_COURT_v52.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found!"
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP"
          unzip -t "$ZIP"

      - name: Extract Android Project
        run: |
          ZIP="Muzammil_Online_Service_PASSPORT_PHOTO_PRO_BACKGROUND_COURT_v52.zip"

          rm -rf project
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Find Android Project
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning \
              --stacktrace
          else
            gradle clean assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning \
              --stacktrace
          fi

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v52-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
