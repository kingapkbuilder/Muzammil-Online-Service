name: Build Muzammil Online Service v67

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find Project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP nahi mila."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Project
        run: |
          rm -rf project
          mkdir project

          unzip -o "$PROJECT_ZIP" -d project

          echo "Project extracted."

      - name: Find Android Gradle Project
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle nahi mila."
            echo "ZIP ke andar valid Android Gradle project nahi mila."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android Project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Gradle project:"
          pwd

          echo "Building APK..."

          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK generate nahi hua."
            exit 1
          fi

          echo "================================"
          echo "APK FOUND"
          echo "$APK"
          echo "================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v67-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
