name: Build Muzammil Online Service APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project ZIP
        run: |
          echo "Repository files:"
          ls -lah

          ZIP="Muzammil_Online_Service_CV_BioData_v9.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found project ZIP: $ZIP"
          unzip -t "$ZIP"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -o "Muzammil_Online_Service_CV_BioData_v9.zip" -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | head -200

      - name: Find Gradle project
        run: |
          SETTINGS=$(find project -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            find project -maxdepth 8 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >>
