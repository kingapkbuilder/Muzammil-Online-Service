name: Build Muzammil Online Service v81

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find or Extract Android Project
        shell: bash
        run: |
          set -e

          echo "Searching Android project..."

          SETTINGS=$(find . \
            -type f \
            -name "settings.gradle.kts" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            echo "Project already extracted:"
            echo "$SETTINGS"
          else
            echo "settings.gradle.kts nahi mila."
            echo "ZIP search kar rahe hain..."

            ZIP=$(find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: Android project ZIP bhi nahi mila."
              echo "Repository files:"
              find . -maxdepth 3 -type f | head -200
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP"

            mkdir -p android_project

            unzip -o "$ZIP" \
              -d android_project

            echo "ZIP extracted."

            SETTINGS=$(find android_project \
              -type f \
              -name "settings.gradle.kts" \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: ZIP extract karne ke baad bhi settings.gradle.kts nahi mila."

              echo "Extracted files:"
              find android_project \
                -maxdepth 6 \
                -type f \
                | head -300

              exit 1
            fi
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "================================"
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          echo "Project files:"
          find "$PROJECT_DIR" \
            -maxdepth 2 \
            -type f \
            | sort

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -d "$PROJECT_DIR/app"

          echo "Android project OK."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK create nahi hua."
            exit 1
          fi

          echo "================================"
          echo "APK CREATED:"
          echo "$APK"
          echo "================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v81-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
