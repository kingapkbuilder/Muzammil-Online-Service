name: Build Muzammil Online Service APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK v26
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check v26 ZIP
        run: |
          ZIP="Muzammil_Online_Service_REFERENCE_UI_MATCHED_v26.zip"

          echo "======================================"
          echo "Muzammil Online Service v26"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: v26 ZIP not found!"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP found: $ZIP"

          echo "Testing ZIP..."
          unzip -t "$ZIP"

          echo "ZIP test successful."

      - name: Extract Android Project
        run: |
          rm -rf project
          mkdir -p project

          unzip -o \
            "Muzammil_Online_Service_REFERENCE_UI_MATCHED_v26.zip" \
            -d project

          echo "Project extracted successfully."

      - name: Find Android Project
        run: |
          SETTINGS=$(find project -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found!"
            find project -maxdepth 8 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper found."
