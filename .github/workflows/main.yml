name: Build Muzammil Online Service v68

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android Project
        run: |
          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app

          echo "Android project found successfully."

      - name: Build APK
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v68-Photoshop-Transform-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
