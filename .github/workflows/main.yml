name: Build and Release Muzammil Online Service APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Locate Android Project
        shell: bash
        run: |
          set -e
          echo "Finding Android Project..."
          
          if [ -f "android/settings.gradle.kts" ]; then
            echo "Found in android/ folder"
            echo "ANDROID_DIR=android" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle.kts" ]; then
            echo "Found in root"
            echo "ANDROID_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -1)
            if [ -n "$ZIP" ]; then
              echo "Extracting $ZIP..."
              mkdir -p extracted_android
              unzip -q -o "$ZIP" -d extracted_android
              ROOT=$(find extracted_android -type f -name "settings.gradle.kts" -print | sed 's#/settings.gradle.kts$##' | head -1)
              echo "ANDROID_DIR=$ROOT" >> "$GITHUB_ENV"
            else
              echo "ERROR: Android project not found!"
              exit 1
            fi
          fi

      - name: Validate Android Project Files
        shell: bash
        run: |
          set -e
          echo "Android Directory: $ANDROID_DIR"
          test -f "$ANDROID_DIR/settings.gradle.kts"
          test -f "$ANDROID_DIR/build.gradle.kts"
          test -f "$ANDROID_DIR/app/build.gradle.kts"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          echo "Project validation successful."

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Package
        shell: bash
        run: |
          set -e
          APK_PATH=$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file not generated!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "$ANDROID_DIR/app/build/outputs/apk/debug/Muzammil-Online-Service-v86.apk"
          echo "FINAL_APK=$ANDROID_DIR/app/build/outputs/apk/debug/Muzammil-Online-Service-v86.apk" >> "$GITHUB_ENV"
          ls -lh "$ANDROID_DIR/app/build/outputs/apk/debug/Muzammil-Online-Service-v86.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v86-APK
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v86.0
          name: "Muzammil Online Service v86 APK"
          body: |
            ## 📲 Muzammil Online Service Android APK (v86)
            Direct download link for Android mobile devices.

            ### What's New in v86:
            - 🔒 **Airtight Master Admin Security:** `admin` / `imran` par galat password se login hone ki problem 100% khatam (strictly `muzammil786`).
            - 🏪 **Multi-Tenant Shop Isolation:** Har operator/staff ko sirf apni dukaan ke bills aur customers dikhenge. Master Admin sabhi dukaane filter kar sakte hain.
            - 📲 **Direct WhatsApp Bill Sharing:** Ek tap me customer ko formal Tax Invoice/Receipt WhatsApp par chali jayegi.
            - ⏳ **Expiry Reminder Alert:** Staff ke account me 3 din bache hone par renewal alert notification.
            - 📊 **Aaj Ka Hisab (Daily Income Report):** Cash vs UPI/Online payment breakdown aur 1-click WhatsApp hisab share.
          files: |
            ${{ env.FINAL_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
