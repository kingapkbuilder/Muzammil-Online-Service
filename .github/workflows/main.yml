name: Build Muzammil Online Service APK v40

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK v40
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project ZIP
        run: |
          ZIP="Muzammil_Online_Service_FINAL_ULTRA_STABLE_v40.zip"

          echo "Checking: $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found!"
            echo "ZIP files available:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP found."
          unzip -t "$ZIP"

      - name: Extract Android Project
        run: |
          rm -rf project
          mkdir -p project

          unzip -o "Muzammil_Online_Service_FINAL_ULTRA_STABLE_v40.zip" -d project

          echo "Project extracted."
          find project -maxdepth 3 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

      - name: Find Android Project
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            find project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building Android Debug APK..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning \
              --stacktrace
          else
            gradle clean assembleDebug \
              -Dkotlin.jvm.target.validation.mode=warning \
              --stacktrace
          fi

      - name: Verify APK
        run: |
          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v40-APK
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
