name: Build Muzammil Online Service v68 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'Muzammil_Online_Service_v68_*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: v68 ZIP nahi mila"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "$PROJECT_ZIP" -d project

          echo "Project structure:"
          find project -maxdepth 5 -type f | sort | head -300

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ROOT=$(find project \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            | sed 's#/settings.gradle.kts$##' \
            | head -1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle.kts nahi mila"
            exit 1
          fi

          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ROOT"

      - name: Validate Android Project
        working-directory: ${{ env.ANDROID_ROOT }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project OK"

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_ROOT }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        working-directory: ${{ env.ANDROID_ROOT }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK generate nahi hua"
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v68-APK
          path: ${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
