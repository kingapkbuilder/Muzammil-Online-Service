name: Build Muzammil Online Service v71 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find v71 ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'Muzammil_Online_Service_v71_*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: v71 ZIP nahi mila."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract v71 Project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$PROJECT_ZIP" -d project

          echo "Project structure:"
          find project -maxdepth 5 -type f | sort | head -300

      - name: Locate Android Gradle Project
        shell: bash
        run: |
          set -e

          ROOT=$(find project \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            | sed 's#/settings.gradle.kts$##' \
            | head -1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project nahi mila."
            exit 1
          fi

          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ROOT"

      - name: Validate Android Project
        working-directory: ${{ env.ANDROID_ROOT }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project validation successful."

      - name: Build v71 Debug APK
        working-directory: ${{ env.ANDROID_ROOT }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ env.ANDROID_ROOT }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK generate nahi hua."
            exit 1
          fi

          echo "================================"
          echo "v71 APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh "$APK"

      - name: Upload v71 APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzammil-Online-Service-v71-APK
          path: ${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
